<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Night — Choose Your Own Adventure</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <p class="kicker">GHW Hacktoberfest · GitHub Copilot</p>
    <h1 id="title">Campus Night</h1>
    <p id="story"></p>
    <div id="choices" class="choices"></div>
    <p id="ending" class="ending" hidden></p>
    <button id="restart" type="button" hidden>Play again</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
